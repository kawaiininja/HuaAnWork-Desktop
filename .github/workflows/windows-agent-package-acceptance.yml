# Windows agent-package M1 Step 5 probe.
#
# This workflow is workflow_dispatch only. Push and pull_request CI do not run
# it, and it is not a required check. Default product gates (yarn check,
# desktop-windows, test:host-liveness-win) are unchanged.
#
# Promote it to a product gate only after one or two green runs are recorded in
# docs/evidence/2026-10-24-agent-package-windows-gha-acceptance.md:
#   1. Move this job into ci.yml with
#      `if: needs.changes.outputs.product == 'true'`, or add pull_request/push
#      triggers here with that same product-change guard.
#   2. Do not set continue-on-error. Do not drop steps from yarn check,
#      desktop-windows, or test:host-liveness-win to make room for it.
#   3. Add the job name windows-agent-package-acceptance as a required check
#      only after those green runs exist.
# GUI chat, the confirm card, and @slug with a real model stay out of this job.

name: Windows agent package acceptance

on:
  workflow_dispatch:
    inputs:
      run_host_liveness:
        description: 'Also build and run test:host-liveness-win (not Step 5; needs a package build)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: windows-agent-package-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-agent-package-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verdict self-check
        run: node --test dsh-plugin-huaanwork/scripts/huaanwork-host-windows-acceptance.spec.mjs
      - name: Windows agent-package acceptance probe
        run: node dsh-plugin-huaanwork/scripts/huaanwork-agent-package-windows-acceptance.mjs --platform win32 --out windows-agent-package-acceptance.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-agent-package-acceptance
          path: windows-agent-package-acceptance.json
          if-no-files-found: warn
      - name: Build HuaAnWork for the optional host liveness test
        if: inputs.run_host_liveness
        run: yarn workspace dsh-plugin-huaanwork build
      - name: Real Host liveness on Windows
        if: inputs.run_host_liveness
        timeout-minutes: 10
        run: yarn workspace dsh-plugin-huaanwork test:host-liveness-win
