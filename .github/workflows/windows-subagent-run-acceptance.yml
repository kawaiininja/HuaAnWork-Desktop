# Windows GHA acceptance for subagent run visibility and targeted cancellation.
#
# Drives the real HuaAnWork renderer over CDP on a Windows runner: a local
# profile registers a local package fixture (@doc-clerk) and a loopback legacy
# catalog fixture (@legacy-demo), types explicit @ messages into the composer,
# and observes the run card through completion and targeted cancellation for
# both channels. The model is a loopback stub and the legacy catalog is a local
# fixture; the JSON report records both boundaries. The job uploads screenshots,
# app/stub/catalog logs, the desktop SHA and the Harness pin.
#
# This workflow is workflow_dispatch only. Push and pull_request CI do not run
# it, and it is not a required check. The existing desktop-windows job keeps
# owning the installer/portable build and the Windows Host liveness gate.
#
# Run it on the exact PR head SHA, then link the run in E-06. A green but never
# dispatched PR check does not satisfy the Windows acceptance path (R-ACC-8).

name: Windows subagent run acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-subagent-run-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-subagent-run-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Record desktop SHA and Harness pin
        shell: bash
        run: |
          {
            echo "### Subagent run acceptance source"
            echo ""
            echo "- Desktop SHA: \`$(git rev-parse HEAD)\`"
            echo "- Branch: \`$(git rev-parse --abbrev-ref HEAD)\`"
            echo "- Harness pin: \`$(git -C deepseek-harness rev-parse HEAD)\`"
            echo "- Runner: \`${ImageOS:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build HuaAnWork
        timeout-minutes: 25
        run: yarn workspace dsh-plugin-huaanwork build
      - name: Verdict self-check
        run: node --test dsh-plugin-huaanwork/scripts/huaanwork-subagent-run-windows-acceptance.spec.mjs
      - name: Real @ completion and cancellation on Windows
        timeout-minutes: 25
        run: >-
          node dsh-plugin-huaanwork/scripts/huaanwork-subagent-run-windows-acceptance.mjs
          --platform win32
          --out artifacts/windows-subagent-run-acceptance.json
          --screenshots artifacts/screenshots
          --logs artifacts/logs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-subagent-run-acceptance
          path: artifacts/
          if-no-files-found: warn
